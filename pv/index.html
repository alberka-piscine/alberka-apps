<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PV Alberka</title>
<meta name="theme-color" content="#13335e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de chantier sobre et sûr, lisible dehors, gros boutons pour le doigt
   IDEA: le carnet de réception du poseur, un dossier par client
   PICTURE: l'outil lui-même : liste des dossiers, assistant en 5 étapes, pad de signature
   COLOUR and TYPE: bleu marine Alberka + sable doré sur fond clair ; Plus Jakarta Sans
   LAYOUT: une colonne calme jusqu'à 900px, barre d'actions collée en bas dans l'assistant */
:root{color-scheme:light dark;
--bg:light-dark(#f5f6f8,#0b1420);--card:light-dark(#ffffff,#121e30);--ink:light-dark(#0f1d30,#e8edf4);--mute:light-dark(#5a6676,#9aa8ba);
--line:light-dark(#dde2e9,#243349);--navy2:light-dark(#13335e,#3a67a8);--sand:#c9a45c;--soft:light-dark(#eef2f8,#172638);
--ok:light-dark(#17794a,#4cc98a);--ko:light-dark(#b3261e,#ff8a80);--warn:light-dark(#8f5b00,#f3b74f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
header.top{background:#13335e;color:#fff;border-bottom:3px solid var(--sand)}
.top .in{max-width:900px;margin:0 auto;padding:10px max(4vw,14px);display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.top .brand{display:flex;gap:10px;align-items:center;background:none;border:0;color:#fff;font:inherit;cursor:pointer;padding:0;text-align:left}
.top b{font-size:17px;display:block;line-height:1.2}.top small{display:block;font-size:12.5px;opacity:.78;font-weight:500}
.top nav{margin-left:auto;display:flex;gap:6px}
.top nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;min-height:42px;padding:0 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:18px max(4vw,14px) 60px}
h1{font-size:clamp(26px,4vw,34px);line-height:1.08;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:19px;margin:0 0 12px;letter-spacing:-.01em}h3{font-size:16px;margin:18px 0 6px}
p{margin:0 0 10px}.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}.btn.gold{background:var(--sand);border-color:var(--sand);color:#1d1606}
.btn.sm{min-height:40px;padding:0 13px;font-size:14px;border-radius:10px}.btn.dang{color:var(--ko)}
.lnk{background:none;border:0;color:var(--navy2);font:inherit;font-weight:700;cursor:pointer;padding:8px 0;min-height:44px}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.sec{margin-top:16px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:88px;resize:vertical}
.f{display:block;margin-bottom:14px}.f>span{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px;color:var(--mute)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:4px 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--mute);font-weight:600}
.stat b{display:block;font-size:26px;color:var(--ink);line-height:1.1}
.search{margin-bottom:14px}
.crow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;margin-bottom:10px;padding:14px 16px}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--navy2);display:grid;place-items:center;font-weight:800;flex:none}
.crow .m{flex:1}.crow .m b{display:block}.crow .m span{font-size:14px;color:var(--mute)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-ok{background:light-dark(#e2f3e9,#123826);color:var(--ok)}.b-warn{background:light-dark(#fbefd9,#3a2c10);color:var(--warn)}
.b-ko{background:light-dark(#fbe3e1,#3d1614);color:var(--ko)}.b-todo{background:var(--soft);color:var(--mute)}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.steps{display:flex;gap:6px;margin:12px 0 16px}
.steps div{flex:1 1 0;font-size:12.5px;font-weight:700;color:var(--mute);line-height:1.2}
.steps div::before{content:"";display:block;height:5px;border-radius:5px;background:var(--line);margin-bottom:6px}
.steps .on{color:var(--ink)}.steps .on::before{background:var(--sand)}.steps .done::before{background:var(--navy2)}
.chk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:700;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.chk[data-v=ok] .op[data-v=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk[data-v=ko] .op[data-v=ko]{background:var(--ko);border-color:var(--ko);color:#fff}
.chk[data-v=na] .op[data-v=na]{background:var(--mute);border-color:var(--mute);color:#fff}
.dec{display:grid;gap:10px}
.dec label{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.dec input,.acc input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px;accent-color:#13335e}
.dec label:has(input:checked){border-color:var(--navy2);background:var(--soft)}
.acc{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-weight:600}
.res{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.rth{display:block;margin-top:8px;width:120px;height:90px;object-fit:cover;border-radius:8px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ph .t,.ph button.t{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--soft);cursor:pointer;position:relative;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer}
.ph .up{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:6px;font-style:normal}
.addph{display:grid;place-items:center;aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;color:var(--navy2);font-weight:700;cursor:pointer;text-align:center;font-size:14px;padding:6px}
.sigbox{border:2px dashed #b9c2cf;border-radius:12px;background:#fff;position:relative;height:190px;margin-bottom:8px}
.sigbox canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:10px}
.sigbox::after{content:"Signez ici avec le doigt";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#a9b2bf;font-weight:700;pointer-events:none;white-space:nowrap}
.sigbox.has::after{display:none}
.wbar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between;border-top:1px solid var(--line);margin-top:18px}
.legal{font-size:13.5px;color:var(--mute);background:var(--soft);border-radius:12px;padding:14px}.legal p:last-child{margin:0}
.note{border-left:4px solid var(--sand);padding:10px 14px;background:var(--soft);border-radius:8px;margin-bottom:14px;font-size:14.5px}
.err{color:var(--ko);font-weight:700;margin:8px 0}
.pvl{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.pvl:last-child{border:0}.pvl .mute{font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.kv{display:grid;grid-template-columns:10em minmax(0,1fr);gap:6px 12px;margin:0}.kv dt{color:var(--mute);font-weight:600}.kv dd{margin:0}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}.tool select{width:auto;flex:1 1 180px}
#modal{position:fixed;inset:0;display:none;z-index:50;background:rgba(8,15,28,.62);padding:16px;place-items:center}
#modal.on{display:grid}.mbox{background:var(--card);border-radius:16px;padding:18px;max-width:680px;width:100%;max-height:92vh;overflow:auto}
.mbox img{max-width:100%;border-radius:10px;display:block;margin:0 auto 12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,180%);background:#13335e;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:60;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{transform:translate(-50%,0)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--sand);animation:sp 1s linear infinite;margin:6px auto 12px}
@keyframes sp{to{transform:rotate(1turn)}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}.spin{animation:none}}
@media(max-width:600px){.g2{grid-template-columns:minmax(0,1fr)}.chk{grid-template-columns:minmax(0,1fr)}.stats{gap:6px}.stat b{font-size:22px}.top small{display:none}.kv{grid-template-columns:minmax(0,1fr)}.kv dd{margin-bottom:6px}.steps div{font-size:0}.steps .on{font-size:12.5px}}

.top .in{padding-top:max(10px,env(safe-area-inset-top))}
</style>
</head>

async function sha256(buf){const h=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
const d2b=u=>{const[h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5,h.indexOf(';'))})};
const b2d=b=>new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)});
async function compress(file,max=1600){const url=URL.createObjectURL(file);try{
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
 const dataUrl=c.toDataURL('image/jpeg',.82);return{blob:d2b(dataUrl),dataUrl,w,h}}finally{URL.revokeObjectURL(url)}}

function pad(cv,key){if(!cv)return;const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
 const x=cv.getContext('2d');x.scale(d,d);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0f1d30';
 if(S.wiz[key]){const i=new Image();i.onload=()=>x.drawImage(i,0,0,r.width,r.height);i.src=S.wiz[key]}
 let on=false,lx=0,ly=0;const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
 cv.onpointerdown=e=>{e.preventDefault();on=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);lx=p.x;ly=p.y;x.beginPath();x.arc(lx,ly,1.2,0,7);x.fillStyle='#0f1d30';x.fill()};
 cv.onpointermove=e=>{if(!on)return;const p=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(p.x,p.y);x.stroke();lx=p.x;ly=p.y};
 const end=()=>{if(!on)return;on=false;S.wiz[key]=cv.toDataURL('image/png');S.wiz[key==='sigC'?'rC':'rE']=r.width/r.height;cv.parentElement.classList.add('has');saveDraft()};
 cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=end}
function afterWiz(){if(S.wiz?.step===4){pad($('#sigC'),'sigC');pad($('#sigE'),'sigE')}}

function validate(){const w=S.wiz,lev=w.type==='levee';

 if(w.step===2&&!lev){const n=checklist(w.ouvrage.cat).filter(i=>!w.checks[i.k]).length;if(n)return`Il reste ${n} point(s) à vérifier avec le client.`}
 if(w.step===3&&!lev){if(w.decision==='sans'&&w.reserves.length)return'Des réserves sont listées : choisissez « avec réserves » ou supprimez-les.';
  if(w.decision==='avec'&&!w.reserves.length)return'Ajoutez au moins une réserve, ou choisissez « sans réserve ».';
  if(w.reserves.some(r=>!String(r.txt).trim()||/à préciser$/.test(r.txt)))return'Décrivez précisément chaque réserve.';
  if(w.decision==='refus'&&!String(w.refus).trim())return'Indiquez le motif du refus.'}
 if(w.step===4){if(!String(w.signClientNom).trim()||!String(w.signEntNom).trim())return'Indiquez le nom des deux signataires.';if(!w.sigC||!w.sigE)return'Les deux signatures sont nécessaires.';if(!w.accept)return'Le client doit cocher la case de lecture et d’acceptation.'}
 return''}

  busyMsg('Enregistrement des signatures…');const sigC=await up(d2b(w.sigC),'image/png'),sigE=await up(d2b(w.sigE),'image/png');

  const core={ref:w.ref,type:w.type,parentId:w.parentId,parentRef:w.parentRef,clientId:w.clientId,date:w.date,lieu:w.lieu,refs:w.refs,ouvrage:w.ouvrage,equipe:w.equipe,checks:w.checks,
